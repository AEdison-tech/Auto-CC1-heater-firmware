# Auto-CC1 chamber heater (ESP32-C3) - Klipper / COSMOS integration
#
# Makes the heater a regular Klipper heater: live temperature and a settable
# target in Fluidd/Mainsail and on the printer display, driven by M141/M191,
# SET_HEATER_TEMPERATURE and switched off by TURN_OFF_HEATERS (cooldown,
# PRINT_END, CANCEL_PRINT, idle timeout).
#
# Requirements:
#   * the cc_heater plugin in /etc/klipper/plugins/cc_heater (see klipper/README.md)
#   * the heater's printer profile set to "Klipper / COSMOS" in its web UI
#
# Usage: copy this file next to printer.cfg and add  [include cc_heater.cfg]
# to printer.cfg, below the COSMOS includes.

[cc_heater]
host: ccheater.local        # heater mDNS name (found again after an IP change) or its IP address
#port: 80
#heater: chamber_heater     # name of the [heater_generic] below
#chamber_sensor: temperature_sensor chamber
max_target: 65              # higher targets are clamped (heater limits too)
#wait_timeout: 3600         # default TIMEOUT of CHAMBER_HEATER_WAIT / M191, s
#fault_action: pause        # pause | warn | shutdown
#link_timeout: 10           # s without reply from the heater = fault

[heater_generic chamber_heater]
heater_pin: cc_heater:pwm
sensor_type: cc_heater
# The heater regulates itself (hysteresis in its web UI); Klipper's control
# output only drives the "power" value shown in the UI.
control: watermark
max_delta: 1.0
min_temp: -10
max_temp: 80

[verify_heater chamber_heater]
# A chamber heats slowly: only flag a heater that clearly does nothing.
# A failed check turns the heater off and pauses the print (fault_action).
max_error: 1800
check_gain_time: 600
hysteresis: 20
heating_gain: 1

# COSMOS' PRINT_START calls "M191 S<CHAMBER>". Wait until the chamber reaches S
# (OrcaSlicer "Minimal"), keeping a higher target set earlier with M141
# (OrcaSlicer "Target"); continue after T seconds (default 1 hour) regardless.
[gcode_macro M191]
description: Wait for chamber temperature S (keeps a higher M141 target)
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _CG28
        SET_DISPLAY_TEXT MSG="Chamber: {s|int}c"
        M106 S255
        G0 X128 Y128 Z10 F9000
        CHAMBER_HEATER_WAIT MINIMUM={s} TIMEOUT={params.T|default(3600)|int}
        M107
    {% endif %}
